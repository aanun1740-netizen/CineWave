name: Stage KinoLab release year filter (one shot)
on:
  push:
    branches: [feature/kinolab-release-year-filter-20261112]
    paths: [.github/workflows/kinolab-year-stage.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kinolab-next/package-lock.json
      - name: Test release year filtering and language selection
        working-directory: kinolab-next
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Build KinoLab production assets
        working-directory: kinolab-next
        run: npm run build
      - name: Stage complete compiled storefront on review branch only
        shell: bash
        run: |
          set -euo pipefail
          cp kinolab-next/dist/index.html index.html
          cp kinolab-next/dist/assets/* assets/
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          const assets=[...html.matchAll(/(?:src|href)="\.\/(assets\/[^"]+)"/g)].map(x=>x[1]);
          if(assets.length<5) throw Error('Incomplete release bundle');
          for (const p of assets) if(!fs.existsSync(p)||fs.statSync(p).size<100)throw Error('Missing or empty asset: '+p);
          const jsPath=assets.find(p=>p.includes('storefront-')&&p.endsWith('.js'));
          const js=fs.readFileSync(jsPath,'utf8');
          if(!js.includes('yearFilter')||!js.includes('All years')||!js.includes('Все годы')||!js.includes('Բոլոր տարիները'))throw Error('Year filter unavailable in built storefront');
          console.log('Production release verified:',assets.length,'assets');
          NODE
          git add index.html assets/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(catalog): stage tested release year filter storefront"
            git push origin HEAD:feature/kinolab-release-year-filter-20261112
          fi
