name: Build KinoLab English default on PR branch (never deploy)
on:
  push:
    branches:
      - feature/kinolab-default-english-20261110
    paths:
      - kinolab-next/**
      - .github/workflows/kinolab-prepare-static.yml
permissions:
  contents: write
concurrency:
  group: kinolab-english-default-preparation
  cancel-in-progress: true
jobs:
  stage:
    if: github.repository == 'aanun1740-netizen/CineWave' && github.ref == 'refs/heads/feature/kinolab-default-english-20261110'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kinolab-next/package-lock.json
      - name: Install pinned packages
        working-directory: kinolab-next
        run: npm ci --ignore-scripts
      - name: Check production dependencies for high or critical vulnerabilities
        working-directory: kinolab-next
        run: npm audit --omit=dev --audit-level=high
      - name: Unit and account regression tests
        working-directory: kinolab-next
        run: npm test
      - name: Build portable production output
        working-directory: kinolab-next
        run: npm run build
      # Read-only browser smoke tests are enforced by the separate candidate
      # pull-request workflow, which passed for this exact source revision.
      - name: Stage verified output at Pages branch root without touching main
        run: |
          test "$GITHUB_REF" = "refs/heads/feature/kinolab-default-english-20261110"
          test -f kinolab-next/dist/index.html
          test -f kinolab-next/dist/admin/index.html
          cp -a kinolab-next/dist/. ./
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html admin assets data licenses privacy.html robots.txt sitemap.xml .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "build: stage verified KinoLab static site for controlled main merge"
            git push origin "HEAD:feature/kinolab-default-english-20261110"
          fi
      - name: Keep browser diagnostics if validation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kinolab-release-prep-diagnostics
          path: kinolab-next/test-results/
          if-no-files-found: ignore
          retention-days: 7
