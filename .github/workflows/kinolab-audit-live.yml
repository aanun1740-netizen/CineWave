name: KinoLab live API and asset audit (one-shot)
on:
  push:
    branches: [feature/kinolab-audit-20261110]
    paths: [.github/workflows/kinolab-audit-live.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test public KinoLab pages and API (no database writes)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { randomUUID } from 'node:crypto';
          import assert from 'node:assert/strict';
          const base = 'https://kinolabmovies.com/';
          const page = await fetch(base);
          assert.equal(page.status, 200, 'Homepage HTTP 200');
          const html = await page.text();
          assert.match(html, /<title>KinoLab/);
          const assets = [...html.matchAll(/(?:src|href)="\.\/(assets\/[^"]+)"/g)].map(x => x[1]);
          assert.ok(assets.length >= 5, 'Homepage contains asset references');
          for (const asset of assets) {
            const res = await fetch(base + asset, {method:'HEAD'});
            console.log('asset',asset,res.status);
            assert.equal(res.status,200,'Missing required asset '+asset);
          }
          const [film, admin] = await Promise.all([fetch(base+'film/1/'),fetch(base+'admin/')]);
          assert.equal(film.status, 200, 'SEO film page');
          assert.equal(admin.status, 200, 'Admin entry exists');
          console.log('PASS homepage, all referenced assets, film page, admin page');

          const endpoint='https://ysecowknittmmmbixgtu.supabase.co/functions/v1/kinolab-ai-v2';
          const headers={
            'Origin':'https://kinolabmovies.com',
            'Content-Type':'application/json',
            'apikey':'sb_publishable_aTNkxAKz9OG-JJVO2X48Rw_9vnE_8Mj',
          };
          const wrong = await fetch(endpoint,{method:'POST',headers,
            body:JSON.stringify({message:'KinoLab connectivity',guest_id:'not-a-uuid'})});
          const wrongPayload = await wrong.json();
          console.log('invalid guest',wrong.status,wrongPayload.error);
          assert.equal(wrong.status,400,'Invalid guest must be rejected without server crash');
          assert.equal(wrongPayload.error,'invalid_guest');

          // This single synthetic visitor question tests the complete provider
          // path. It spends exactly one anonymous request; no user data are changed.
          const response = await fetch(endpoint,{method:'POST',headers,
            body:JSON.stringify({message:'Recommend 3 comedy movies from KinoLab',language:'en',guest_id:randomUUID()})});
          const payload = await response.json();
          console.log('KinoLab AI answer status:',response.status,'error:',payload.error || 'none',
              'answerLength:',typeof payload.answer === 'string' ? payload.answer.length : 0,
              'recommendedIDs:',Array.isArray(payload.recommendations)?payload.recommendations.length:0);
          assert.equal(response.status,200,'AI provider or catalog error '+(payload.error||'unexpected'));
          assert.ok(typeof payload.answer === 'string' && payload.answer.length > 5,'AI should return text');
          assert.ok(Array.isArray(payload.recommendations),'AI should return current catalog recommendation IDs');
          console.log('PASS AI live provider / catalog end-to-end');
          NODE
