name: Stage KinoLab login redirect release
on:
  push:
    branches: [feature/kinolab-login-redirect-home-20261111]
    paths: [.github/workflows/kinolab-login-stage.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kinolab-next/package-lock.json
      - name: Test sign-in, signup, and profile access
        working-directory: kinolab-next
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Build full KinoLab storefront
        working-directory: kinolab-next
        run: npm run build
      - name: Stage complete release assets on review branch
        shell: bash
        run: |
          set -euo pipefail
          cp kinolab-next/dist/index.html index.html
          cp kinolab-next/dist/assets/* assets/
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          const paths=[...html.matchAll(/(?:src|href)="\.\/(assets\/[^"]+)"/g)].map(x=>x[1]);
          if(paths.length<5) throw Error('Incomplete KinoLab release bundle');
          for(const p of paths) if(!fs.existsSync(p) || fs.statSync(p).size<100) throw Error('Invalid release file '+p);
          const js=fs.readFileSync(paths.find(p=>p.includes('storefront-')&&p.endsWith('.js')),'utf8');
          if(!js.includes('home')) throw Error('Missing storefront route');
          console.log('Verified full release assets:',paths.length);
          NODE
          git add index.html assets/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(auth): stage verified login-to-home KinoLab production assets"
            git push origin HEAD:feature/kinolab-login-redirect-home-20261111
          fi
