name: KinoLab auth-fix review build (no deploy)
on:
  push:
    branches:
      - feature/kinolab-auth-confirmation-fix-20261110
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kinolab-next/package-lock.json
      - name: Install and unit-test
        working-directory: kinolab-next
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Build static KinoLab site
        working-directory: kinolab-next
        run: npm run build
      - name: Stage the reviewed storefront build on this feature branch only
        if: github.ref == 'refs/heads/feature/kinolab-auth-confirmation-fix-20261110'
        run: |
          cp kinolab-next/dist/index.html index.html
          cp kinolab-next/dist/assets/storefront-*.js assets/
          git add index.html assets/storefront-*.js
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: stage tested KinoLab email confirmation fix"
            git push origin HEAD:feature/kinolab-auth-confirmation-fix-20261110
          fi
      - name: Preserve reviewed build files (no deploy)
        uses: actions/upload-artifact@v4
        with:
          name: kinolab-auth-fix-static-build
          path: kinolab-next/dist/
          retention-days: 2
          if-no-files-found: error
