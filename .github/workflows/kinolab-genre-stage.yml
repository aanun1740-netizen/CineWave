name: Stage KinoLab genre dropdown release
on:
  push:
    branches: [feature/kinolab-genre-select-like-year-20261113]
    paths: [.github/workflows/kinolab-genre-stage.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kinolab-next/package-lock.json
      - name: Run KinoLab catalog filtering tests and dependency checks
        working-directory: kinolab-next
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          npm test
      - name: Build complete KinoLab release assets
        working-directory: kinolab-next
        run: npm run build
      - name: Stage rebuilt storefront without changing admin
        shell: bash
        run: |
          set -euo pipefail
          cp kinolab-next/dist/index.html index.html
          cp kinolab-next/dist/assets/* assets/
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          const files=[...html.matchAll(/(?:src|href)="\.\/(assets\/[^"]+)"/g)].map(m=>m[1]);
          if(files.length<5)throw Error('Missing production storefront assets');
          for(const f of files)if(!fs.existsSync(f)||fs.statSync(f).size<100)throw Error('Bad asset '+f);
          const js=fs.readFileSync(files.find(x=>x.includes('storefront-')&&x.endsWith('.js')),'utf8');
          if(!js.includes('genreFilter')||!js.includes('yearFilter'))throw Error('Dropdowns not bundled');
          console.log('Verified',files.length,'production assets including genre + year selectors');
          NODE
          git add index.html assets/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(catalog): stage KinoLab genre select release'
            git push origin HEAD:feature/kinolab-genre-select-like-year-20261113
          fi
